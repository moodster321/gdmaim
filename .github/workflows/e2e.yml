name: e2e

# Exports tests/e2e/fixture with and without GDMaim and runs both builds (tests/run_e2e.py).

on:
  pull_request:
  push:
    branches: [main, gdmaim-p0]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot 4.7.1
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-4.7.1-stable-linux

      - name: Download Godot 4.7.1
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v4.7.1-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Run the end-to-end export tests
        run: GODOT_BIN="$HOME/godot/godot" python3 tests/run_e2e.py
